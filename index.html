<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pichenette</title>
<style>
html,body{margin:0;height:100%;background:#1a2433;color:#e8eef7;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.box{text-align:center;opacity:.92}
.big{font-size:54px;margin-bottom:8px}
small{opacity:.6}
</style>
</head>
<body>
<div class="box"><div class="big">⚽</div><div>Chargement de Pichenette…</div><small>redirection vers la dernière version</small></div>
<script>
(function () {
  var FALLBACK = "v9.33.html";            // version de secours si tout échoue
  var reM = /^v(\d+)\.(\d+)\.html$/;      // fichiers de version : v8.5.html, v8.9.html…
  var last = null;
  try { last = localStorage.getItem("pichn_last_version"); } catch (e) {}
  function go(name) {
    try { localStorage.setItem("pichn_last_version", name); } catch (e) {}
    location.replace(name);
  }
  function cmp(a, b) { return a === b ? 0 : (a < b ? -1 : 1); }
  // 1) API GitHub (exacte, mais souvent limitée en débit → 403)
  fetch("https://api.github.com/repos/Drasahaoe/pichenette/contents/")
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (d) {
      if (!Array.isArray(d)) throw new Error("shape");
      var vs = d.map(function (f) { return f.name; }).filter(function (n) { return reM.test(n); }).sort(cmp);
      if (!vs.length) throw new Error("empty");
      go(vs[vs.length - 1]);
    })
    .catch(function () { probe(); });
  // 2) Sondage DIRECT sur ce site (même origine : toujours frais, insensible aux caches CDN
  //    comme jsDelivr qui a déjà servi des listes obsolètes → vieilles versions du jeu)
  function probe() {
    var base = (last && reM.exec(last)) || [null, "8", "9"];
    var M = parseInt(base[1], 10);
    var cands = [];
    var m, n, m2;
    for (m = 0; m <= 99; m++) cands.push("v" + M + "." + m + ".html");
    for (n = 1; n <= 2; n++) for (m2 = 0; m2 <= 9; m2++) cands.push("v" + (M + n) + "." + m2 + ".html");
    var best = null, i = 0;
    (function next() {
      if (i >= cands.length) { go(best || last || FALLBACK); return; }
      var f = cands[i++];
      fetch(f, { method: "HEAD" })
        .then(function (r) { if (r.ok) best = f; next(); }, next)
        .catch(next);
    })();
  }
})();
</script>
