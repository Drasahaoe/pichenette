<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pichenette</title>
<style>
html,body{margin:0;height:100%;background:#1a2433;color:#e8eef7;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.box{text-align:center;opacity:.92}
.big{font-size:54px;margin-bottom:8px}
small{opacity:.6}
</style>
</head>
<body>
<div class="box"><div class="big">⚽</div><div>Chargement de Pichenette…</div><small>redirection vers la dernière version</small></div>
<script>
(function () {
  var FALLBACK = "v8.6.html";           // version de secours si les API ne répondent pas
  var re = /^v\d+(\.\d+)*\.html$/;      // fichiers de version : v8.5.html, v8.6.html…
  var last = null;
  try { last = localStorage.getItem("pichn_last_version"); } catch (e) {}
  function cmp(a, b) {
    var pa = a.replace(/^v/, "").replace(/\.html$/, "").split(".");
    var pb = b.replace(/^v/, "").replace(/\.html$/, "").split(".");
    for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
      var x = parseInt(pa[i] || "0", 10), y = parseInt(pb[i] || "0", 10);
      if (x !== y) return x - y;
    }
    return 0;
  }
  function go(name) {
    try { localStorage.setItem("pichn_last_version", name); } catch (e) {}
    location.replace(name);
  }
  function pick(names) {
    var files = names.filter(function (n) { return re.test(n); }).sort(cmp);
    if (files.length) go(files[files.length - 1]);
    else go(last || FALLBACK);
  }
  // 1) API GitHub (toujours à jour) — 2) jsDelivr (secours) — 3) dernier connu / FALLBACK
  fetch("https://api.github.com/repos/Drasahaoe/pichenette/contents/")
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (Array.isArray(d)) { pick(d.map(function (f) { return f.name; })); return; }
      throw new Error("api");
    })
    .catch(function () {
      fetch("https://data.jsdelivr.com/v1/packages/gh/Drasahaoe/pichenette@main")
        .then(function (r) { return r.json(); })
        .then(function (d) {
          pick((d && d.files ? d.files : []).map(function (f) { return f.name; }));
        })
        .catch(function () { go(last || FALLBACK); });
    });
})();
</script>
